<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>My funny little Calculator</title>
		<link href="css/style.css" rel="stylesheet">
		<script src="js/main.js" defer></script>
	</head>
	<body>
		<header>
			<h1>Calculator</h1>
		</header>
		<div id="root">
			<div id="calc">
				<div id="calc-screen">
					<p id="calc-text">123456</p>
				</div>
				<div id="calc-menu">
					<button type="button" class="btn double" id="clear">C</button>
					<button type="button" class="btn" id="remainder">%</button>
					<button type="button" class="btn" id="divide">÷</button>
					<button type="button" class="btn digit">7</button>
					<button type="button" class="btn digit" id="eight">8</button>
					<button type="button" class="btn digit">9</button>
					<button type="button" class="btn" id="multiply">×</button>
					<button type="button" class="btn digit">4</button>
					<button type="button" class="btn digit">5</button>
					<button type="button" class="btn digit">6</button>
					<button type="button" class="btn" id="minus">−</button>
					<button type="button" class="btn digit">1</button>
					<button type="button" class="btn digit">2</button>
					<button type="button" class="btn digit">3</button>
					<button type="button" class="btn" id="plus">+</button>
					<button type="button" class="btn double" id="zero">0</button>
					<button type="button" class="btn" id="dot">.</button>
					<button type="button" class="btn" id="equals">=</button>
				</div>
			</div>
		</div>
	</body>
</html>
