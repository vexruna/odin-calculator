<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>My funny little Calculator</title>
		<link href="css/style.css" rel="stylesheet">
	</head>
	<body>
		<header>
			<h1>Calculator</h1>
		</header>
		<div id="root">
			<div id="calc">
				<div id="calc-screen">
					<p id="calc-text">123456</p>
				</div>
				<div id="calc-menu">
					<button type="button" class="btn double">C</button>
					<button type="button" class="btn">%</button>
					<button type="button" class="btn">÷</button>
					<button type="button" class="btn">7</button>
					<button type="button" class="btn">8</button>
					<button type="button" class="btn">9</button>
					<button type="button" class="btn">×</button>
					<button type="button" class="btn">4</button>
					<button type="button" class="btn">5</button>
					<button type="button" class="btn">6</button>
					<button type="button" class="btn">−</button>
					<button type="button" class="btn">1</button>
					<button type="button" class="btn">2</button>
					<button type="button" class="btn">3</button>
					<button type="button" class="btn">+</button>
					<button type="button" class="btn double">0</button>
					<button type="button" class="btn">.</button>
					<button type="button" class="btn">=</button>
				</div>
			</div>
		</div>
	</body>
</html>
